[project]
name = "data-catalogue-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/catalogue"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
